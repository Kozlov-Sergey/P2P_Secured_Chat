<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Чат</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #12141a; color: #e8eaf0; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2a2e3a; }
  header h1 { font-size: 20px; }
  .status { font-size: 13px; padding: 4px 10px; border-radius: 12px; background: #2a2e3a; }
  .status.ok { background: #1d4a2c; color: #7ee7a3; }
  .status.err { background: #4a1d1d; color: #ff8a8a; }
  .panel { background: #1a1d26; border: 1px solid #2a2e3a; border-radius: 12px; padding: 14px; margin-top: 12px; }
  .panel h2 { font-size: 15px; margin-bottom: 8px; color: #aab2c5; }
  textarea { width: 100%; min-height: 90px; background: #12141a; color: #e8eaf0; border: 1px solid #2a2e3a; border-radius: 8px; padding: 8px; font-size: 13px; font-family: monospace; }
  button { background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 15px; cursor: pointer; margin: 6px 6px 0 0; }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: #2a2e3a; }
  button.danger { background: #b91c1c; }
  .code-out { margin-top: 8px; word-break: break-all; font-family: monospace; font-size: 12px; background: #12141a; padding: 8px; border-radius: 8px; max-height: 120px; overflow: auto; }
  .sec-code { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: 2px; padding: 8px; border-radius: 8px; background: #2a2e3a; margin-top: 10px; }
  .sec-code.ok { background: #1d4a2c; color: #7ee7a3; }
  .diag { font-size: 12px; color: #8b93a7; margin-top: 6px; }
  #chat { margin-top: 12px; }
  #msgs { background: #1a1d26; border: 1px solid #2a2e3a; border-radius: 12px; padding: 10px; height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.35; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: #3b82f6; }
  .msg.peer { align-self: flex-start; background: #2a2e3a; }
  .inrow { display: flex; gap: 8px; margin-top: 10px; }
  .inrow input { flex: 1; background: #1a1d26; border: 1px solid #2a2e3a; border-radius: 8px; color: #e8eaf0; padding: 12px; font-size: 15px; }
  #callPanel { display: none; margin-top: 12px; }
  #remoteVideo { width: 100%; border-radius: 12px; background: #000; }
  #localVideo { width: 110px; border-radius: 8px; background: #000; position: absolute; top: 12px; right: 12px; }
  .videoBox { position: relative; }
  .callrow { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .callrow label { font-size: 13px; color: #aab2c5; }
  .hint { font-size: 12px; color: #8b93a7; margin-top: 6px; }
  .errbox { background: #4a1d1d; color: #ffb0b0; border-radius: 8px; padding: 8px; font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>P2P Чат</h1>
    <div>
      <button id="btnSound" class="ghost" style="padding:6px 10px;font-size:14px" title="Звук вкл/выкл">🔔</button>
      <span class="status" id="status">нет соединения</span>
    </div>
  </header>

  <div id="notwebrtc" class="errbox"></div>

  <div class="panel">
    <h2>1. Соединение</h2>
    <button id="btnCreate">Начать чат</button>
    <button id="btnJoin" class="ghost">Присоединиться</button>
    <div style="margin-top:10px"><textarea id="inCode" placeholder="Вставьте код здесь"></textarea></div>
    <button id="btnUse" class="ghost">Применить код</button>
    <div class="hint" id="stepHint"></div>
    <div class="code-out" id="codeOut" style="display:none"></div>
    <button id="btnCopy" class="ghost" style="display:none">копировать</button>
    <div class="errbox" id="errBox"></div>
  </div>

  <div class="panel" id="secPanel" style="display:none">
    <h2>Код безопасности (сверьте голосом!)</h2>
    <div class="sec-code" id="secCode">— — —</div>
    <button id="btnSecOk" class="ghost">Коды совпали</button>
    <div class="diag" id="diag"></div>
  </div>

  <div class="panel" id="callCtrl" style="display:none">
    <h2>Звонок</h2>
    <button id="btnCall">📞 Позвонить</button>
    <button id="btnCheckMedia" class="ghost">🎤📷 Проверить доступ</button>
  </div>

  <div id="callPanel">
    <div class="panel videoBox">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="callrow">
        <button id="btnMic" class="ghost">🎙</button>
        <button id="btnCam" class="ghost">📷</button>
        <button id="btnSwitch" class="ghost">🔁</button>
        <button id="btnHang" class="danger">✕ Завершить</button>
        <label>🔊 <input type="range" id="vol" min="0" max="100" value="100" style="vertical-align:middle"></label>
      </div>
    </div>
  </div>

  <div id="chat" style="display:none">
    <div id="msgs"></div>
    <div class="inrow">
      <input id="inMsg" placeholder="Сообщение…" autocomplete="off">
      <button id="btnSend">➤</button>
      <button id="btnClear" class="ghost" title="Очистить историю">🗑</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const LS_HIST='p2p_hist', LS_SOUND='p2p_sound', LS_FACING='p2p_facing', LS_VOL='p2p_vol';

if (!window.RTCPeerConnection) {
  $('notwebrtc').style.display='block';
  $('notwebrtc').textContent='Этот браузер не поддерживает WebRTC. Используйте свежие Chrome, Safari, Firefox или Яндекс Браузер.';
}

let pc=null, dc=null, localStream=null, inCall=false;
let pendingCandidates=[];
let mode=null; // 'chat' | 'call' — какой обмен кодами идёт сейчас
let soundOn = localStorage.getItem(LS_SOUND)!=='off';
let audioCtx=null;

function setStatus(t, cls){ const s=$('status'); s.textContent=t; s.className='status'+(cls?' '+cls:''); }
function showErr(m){ const e=$('errBox'); e.style.display=m?'block':'none'; e.textContent=m||''; }
function hint(t){ $('stepHint').textContent=t||''; }

function beep(n){
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    for(let i=0;i<n;i++){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime+i*0.22;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.18,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    }
  }catch(e){}
}

$('btnSound').onclick=()=>{ soundOn=!soundOn; localStorage.setItem(LS_SOUND,soundOn?'on':'off'); $('btnSound').textContent=soundOn?'🔔':'🔕'; if(soundOn)beep(1); };
$('btnSound').textContent=soundOn?'🔔':'🔕';

/* детерминированный хеш (работает и без secure context) */
function code6(s){
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    h1=(h1^c)>>>0; h1=Math.imul(h1,0x01000193)>>>0;
    h2=(h2+c*31+i)>>>0; h2=Math.imul(h2,0x85ebca6b)>>>0;
  }
  let out=''; let a=h1,b=h2;
  for(let i=0;i<6;i++){ out+=String((a+b)%10); a=(Math.imul(a,0x27d4eb2d)^b)>>>0; b=(Math.imul(b,0x165667b1)^a)>>>0; }
  return out;
}
function fmtSec(d){ return d.slice(0,3)+' '+d.slice(3); }

/* копирование */
function showCode(txt){
  const el=$('codeOut'); el.textContent=txt; el.style.display='block';
  $('btnCopy').style.display='inline-block'; $('btnCopy').textContent='копировать';
  window.__code=txt;
}
function copyDone(){ $('btnCopy').textContent='Скопировано ✓'; setTimeout(()=>$('btnCopy').textContent='копировать',1500); }
$('btnCopy').onclick=()=>{
  const done=copyDone;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(window.__code).then(done).catch(()=>fallbackCopy(done));
  } else fallbackCopy(done);
};
function fallbackCopy(done){
  const ta=document.createElement('textarea'); ta.value=window.__code;
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }
  catch(e){ showErr('Не удалось скопировать — выделите код вручную.'); }
  ta.remove();
}

/* упаковка */
function pack(s){ return btoa(unescape(encodeURIComponent(s))); }
function unpack(s){ return decodeURIComponent(escape(atob(s.replace(/\s+/g,'')))); }

/* peer connection */
function newPC(){
  pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]});
  pendingCandidates=[];
  pc.onicecandidate=e=>{ if(e.candidate) pendingCandidates.push(e.candidate); };
  pc.onicegatheringstatechange=()=>{ if(pc.iceGatheringState==='complete' && pc.__gr) pc.__gr(); };
  pc.onconnectionstatechange=()=>{
    const st=pc.connectionState;
    if(st==='connected') setStatus(inCall?'соединено (звонок)':'соединено','ok');
    else if(st==='failed') setStatus('сбой','err');
    else if(st==='disconnected') setStatus('потеряно');
    else if(st==='closed') setStatus('нет соединения');
  };
  dc=pc.createDataChannel('chat',{ordered:true});
  wireDC(dc);
  pc.ondatachannel=e=>{ dc=e.channel; wireDC(dc); };
  return pc;
}
async function gatherComplete(){
  if(pc.iceGatheringState==='complete') return;
  await new Promise(r=>{ pc.__gr=r; setTimeout(r,4000); });
}

function wireDC(ch){
  ch.onopen=()=>{
    setStatus('соединено','ok');
    $('chat').style.display='block';
    $('secPanel').style.display='block';
    $('callCtrl').style.display='block';
    showSec(); beep(2); loadHistory();
    hint('');
  };
  ch.onmessage=e=>{
    if(e.data==='__CALL_END__'){ endCall(); setStatus('соединено','ok'); return; }
    addMsg('peer', e.data); saveHistory('peer', e.data); beep(1);
  };
  ch.onclose=()=>setStatus('потеряно');
}

async function showSec(){
  try{
    const stats=await pc.getStats();
    const fp=[];
    stats.forEach(r=>{ if(r.type==='certificate'&&r.fingerprint) fp.push(r.fingerprint); });
    if(fp.length>=2){
      fp.sort();
      $('secCode').textContent=fmtSec(code6(fp[0]+'|'+fp[1]));
      $('btnSecOk').onclick=()=>{ $('secCode').classList.add('ok'); $('btnSecOk').disabled=true; };
    }
  }catch(e){}
}

/* единая обработка вставленных кодов */
$('btnUse').onclick=async()=>{
  showErr('');
  const raw=$('inCode').value;
  if(!raw.trim()){ showErr('Сначала вставьте код.'); return; }
  let d;
  try{ d=JSON.parse(unpack(raw)); }catch(e){ showErr('Код не распознан. Скопируйте его целиком.'); return; }

  try{
    if(d.t==='o'){            // входящий offer чата
      newPC(); setStatus('готовим ответ…'); mode='chat';
      await pc.setRemoteDescription(d.s);
      (d.c||[]).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));
      const ans=await pc.createAnswer();
      await pc.setLocalDescription(ans);
      await gatherComplete();
      showCode(pack(JSON.stringify({t:'a',s:pc.localDescription,c:pendingCandidates})));
      hint('Ответный код готов — отправьте его первому.');
      setStatus('ожидаем подключения…');
    }
    else if(d.t==='a'){       // входящий answer чата
      if(!pc || mode!=='chat') throw new Error('Сейчас не нужен код ответа чата.');
      await pc.setRemoteDescription(d.s);
      (d.c||[]).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));
      hint('Ответ принят — ждём соединения…');
    }
    else if(d.t==='co'){      // входящий offer звонка
      if(!pc || !dc || dc.readyState!=='open') throw new Error('Сначала установите чат.');
      mode='call'; setStatus('входящий звонок — отвечаем…');
      localStream=await getMedia();
      localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
      await pc.setRemoteDescription(d.s);
      (d.c||[]).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));
      const ans=await pc.createAnswer();
      await pc.setLocalDescription(ans);
      await gatherComplete();
      showCode(pack(JSON.stringify({t:'ca',s:pc.localDescription,c:pendingCandidates})));
      hint('Ответ на звонок готов — отправьте его звонящему.');
      beep(3);
    }
    else if(d.t==='ca'){      // входящий answer звонка (для звонящего)
      if(!pc || mode!=='call') throw new Error('Сейчас не нужен код ответа звонка.');
      await pc.setRemoteDescription(d.s);
      (d.c||[]).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));
      startCallUI();
      hint('Звонок устанавливается…');
    }
  }catch(e){
    showErr(e.message || 'Не удалось применить код.');
  }
};

/* создать чат */
$('btnCreate').onclick=async()=>{
  showErr(''); mode='chat';
  newPC(); setStatus('готовим код…');
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  await gatherComplete();
  showCode(pack(JSON.stringify({t:'o',s:pc.localDescription,c:pendingCandidates})));
  hint('Код готов. Отправьте его собеседнику; его ответный код вставьте выше и нажмите «Применить код».');
  $('btnJoin').disabled=false;
};

/* присоединиться: просто подсказка — всё делает «Применить код» */
$('btnJoin').onclick=()=>{
  showErr(''); hint('Вставьте код собеседника в поле выше и нажмите «Применить код».');
};

/* медиа */
async function getMedia(){
  const facing=localStorage.getItem(LS_FACING)||'user';
  try{
    return await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});
  }catch(e1){
    try{
      return await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    }catch(e2){
      let why='Не удалось получить доступ к камере и микрофону. ';
      if(e2 && e2.name==='NotAllowedError') why+='Доступ запрещён: значок 🔒 в адресной строке → Разрешения → «Разрешить».';
      else if(e2 && e2.name==='NotFoundError') why+='Камера или микрофон не найдены.';
      else if(e2 && e2.name==='NotReadableError') why+='Устройство занято другим приложением.';
      else why+=(e2 && (e2.message||e2.name)) || e1 && (e1.message||e1.name);
      throw new Error(why);
    }
  }
}
$('btnCheckMedia').onclick=async()=>{
  showErr('');
  try{
    const s=await getMedia();
    s.getTracks().forEach(t=>t.stop());
    beep(1);
    hint('Доступ к камере и микрофону разрешён — можно звонить.');
  }catch(e){ showErr(e.message); }
};

/* начать звонок */
$('btnCall').onclick=async()=>{
  showErr('');
  if(!pc || !dc || dc.readyState!=='open'){ showErr('Сначала установите чат.'); return; }
  try{
    localStream=await getMedia();
    localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
    mode='call'; setStatus('готовим код звонка…');
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    await gatherComplete();
    showCode(pack(JSON.stringify({t:'co',s:pc.localDescription,c:pendingCandidates})));
    hint('Код звонка готов — отправьте его собеседнику, а его ответ вставьте выше и нажмите «Применить код».');
  }catch(e){
    setStatus('сбой','err');
    showErr(e.message);
  }
};

function startCallUI(){
  inCall=true;
  $('callPanel').style.display='block';
  const rs=new MediaStream();
  pc.getReceivers().forEach(r=>{ if(r.track) rs.addTrack(r.track); });
  $('remoteVideo').srcObject=rs;
  $('localVideo').srcObject=localStream;
  $('vol').value=localStorage.getItem(LS_VOL)||100;
  $('remoteVideo').volume=($('vol').value/100);
  setStatus('соединено (звонок)','ok');
  beep(3);
}
$('vol').oninput=()=>{ $('remoteVideo').volume=($('vol').value/100); localStorage.setItem(LS_VOL,$('vol').value); };

$('btnMic').onclick=()=>{ if(!localStream) return; const t=localStream.getAudioTracks()[0]; if(t){ t.enabled=!t.enabled; $('btnMic').textContent=t.enabled?'🎙':'🔇'; } };
$('btnCam').onclick=()=>{ if(!localStream) return; const t=localStream.getVideoTracks()[0]; if(t){ t.enabled=!t.enabled; $('btnCam').textContent=t.enabled?'📷':'🚫'; } };

$('btnSwitch').onclick=async()=>{
  if(!localStream || !pc) return;
  const next=(localStorage.getItem(LS_FACING)||'user')==='user'?'environment':'user';
  try{
    const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:next},audio:false});
    const nv=ns.getVideoTracks()[0];
    const oldV=localStream.getVideoTracks()[0];
    const sender=pc.getSenders().find(s=>s.track && s.track.kind==='video');
    if(sender) await sender.replaceTrack(nv);
    localStream.removeTrack(oldV); try{ oldV.stop(); }catch(e){}
    localStream.addTrack(nv);
    $('localVideo').srcObject=localStream;
    localStorage.setItem(LS_FACING,next);
  }catch(e1){
    try{
      const devs=await navigator.mediaDevices.enumerateDevices();
      const cams=devs.filter(d=>d.kind==='videoinput');
      if(cams.length<2){ showErr('Вторая камера не найдена.'); return; }
      const cur=localStream.getVideoTracks()[0].getSettings();
      let idx=cams.findIndex(d=>d.deviceId===(cur.deviceId||''));
      idx=(idx+1)%cams.length;
      const ns=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:cams[idx].deviceId}},audio:false});
      const nv=ns.getVideoTracks()[0];
      const oldV=localStream.getVideoTracks()[0];
      const sender=pc.getSenders().find(s=>s.track && s.track.kind==='video');
      if(sender) await sender.replaceTrack(nv);
      localStream.removeTrack(oldV); try{ oldV.stop(); }catch(e){}
      localStream.addTrack(nv);
      $('localVideo').srcObject=localStream;
    }catch(e2){ showErr('Не удалось переключить камеру: '+((e2&&(e2.message||e2.name))||e1.message)); }
  }
};

$('btnHang').onclick=()=>{
  if(dc && dc.readyState==='open'){ try{ dc.send('__CALL_END__'); }catch(e){} }
  endCall();
  setStatus('соединено','ok');
};
function endCall(){
  inCall=false;
  $('callPanel').style.display='none';
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  $('localVideo').srcObject=null;
  $('remoteVideo').srcObject=null;
  $('btnMic').textContent='🎙'; $('btnCam').textContent='📷';
}

/* чат и история */
function loadHistory(){
  JSON.parse(localStorage.getItem(LS_HIST)||'[]').forEach(m=>addMsg(m.who,m.text));
}
function saveHistory(who,text){
  let h=JSON.parse(localStorage.getItem(LS_HIST)||'[]');
  h.push({who,text});
  if(h.length>300) h=h.slice(-300);
  localStorage.setItem(LS_HIST,JSON.stringify(h));
}
function addMsg(who,text){
  const d=document.createElement('div');
  d.className='msg '+who; d.textContent=text;
  $('msgs').appendChild(d);
  $('msgs').scrollTop=$('msgs').scrollHeight;
}
$('btnSend').onclick=send;
$('inMsg').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
function send(){
  const t=$('inMsg').value.trim();
  if(!t || !dc || dc.readyState!=='open') return;
  dc.send(t); addMsg('me',t); saveHistory('me',t);
  $('inMsg').value='';
}
$('btnClear').onclick=()=>{ localStorage.removeItem(LS_HIST); $('msgs').innerHTML=''; };

/* диагностика пути */
let diagDone=false;
const poll=setInterval(()=>{
  if(!pc || pc.connectionState!=='connected' || diagDone) return;
  diagDone=true;
  pc.getStats().then(stats=>{
    stats.forEach(r=>{
      if(r.type==='candidate-pair' && r.state==='succeeded' && r.nominated){
        const c=stats.get(r.remoteCandidateId)||stats.get(r.localCandidateId);
        if(c){
          $('diag').textContent = c.candidateType==='host'
            ? 'Путь: прямая связь в одной сети (host)'
            : 'Путь: соединение пробилось через NAT напрямую (srflx) — сервер-посредник не используется';
        }
      }
    });
  }).catch(()=>{});
},1500);
</script>
</body>
</html>
